<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cart — Fernline Media</title><link rel="icon" href="images/favicon.svg"><link rel="stylesheet" href="css/style.css"></head>
<body data-page="cart">
<section class="page-head"><div class="container"><span class="eyebrow">Your cart</span><h1 style="font-size:clamp(2rem,4vw,3rem)">Cart</h1></div></section>
<section style="padding-bottom:70px"><div class="container"><div class="cart-layout">
 <div id="items"></div>
 <aside class="summary" id="summary"></aside>
</div></div></section>
<script src="js/data.js"></script><script src="js/app.js"></script>
<script>
function drawCart(){
 const c=TL.cart.get(),el=document.getElementById("items");
 if(!c.length){el.innerHTML=`<div class="empty" style="background:#fff;border-radius:14px;border:1px solid var(--line)"><h3>Your cart is empty</h3><p>Find the perfect shot for your next campaign.</p><a class="btn" href="gallery.html">Browse photos</a></div>`}
 else el.innerHTML=c.map((i,idx)=>{
  if(i.type==="plan"){const p=TL.PLANS[i.id];return `<div class="cart-item"><div style="width:120px;height:80px;border-radius:8px;background:linear-gradient(135deg,#1f5c46,#e8873a);display:grid;place-items:center;color:#fff;font-weight:800">PLAN</div>
   <div><b>${p.name} subscription</b><div style="color:var(--muted);font-size:.88rem">${p.dl} · billed ${i.billing}</div><button class="link-btn" data-rm="${idx}">Remove</button></div>
   <div class="amt"><b>${TL.money(TL.cart.lineTotal(i))}</b><div style="color:var(--muted);font-size:.8rem">${i.billing==="annual"?"/ year":"/ month"}</div></div></div>`}
  const p=TL.photoById(i.id);if(!p)return"";
  return `<div class="cart-item"><img src="${p.img}" alt="${p.title}"><div><b>${p.title}</b><div style="color:var(--muted);font-size:.85rem">${p.id} · by ${p.photographer}${p.premium?" · Premium":""}</div>
   <select data-lic="${idx}" aria-label="License">${Object.entries(TL.LICENSES).map(([k,l])=>`<option value="${k}" ${k===i.license?"selected":""}>${l.name} — ${TL.money(TL.priceFor(p,k))}</option>`).join("")}</select><br><button class="link-btn" data-rm="${idx}">Remove</button></div>
   <div class="amt"><b>${TL.money(TL.cart.lineTotal(i))}</b></div></div>`}).join("");
 const sub=TL.cart.total();
 document.getElementById("summary").innerHTML=`<h3>Order summary</h3><div class="line"><span>Items</span><span>${c.length}</span></div><div class="line"><span>Subtotal</span><span>${TL.money(sub)}</span></div><div class="line"><span>Tax</span><span>Calculated at checkout</span></div><div class="line total"><span>Total</span><span>${TL.money(sub)}</span></div>
  <a class="btn block ${c.length?"":"ghost"}" style="margin-top:16px;${c.length?"":"pointer-events:none;opacity:.5"}" href="checkout.html">Proceed to checkout</a>
  ${c.length?'<button class="link-btn" id="clear" style="margin-top:12px">Clear cart</button>':""}<p style="font-size:.8rem;color:var(--muted);margin-top:14px">Demo store: cart is saved in your browser (localStorage). No payment is taken.</p>`;
}
document.addEventListener("DOMContentLoaded",()=>{
 drawCart();
 document.body.addEventListener("click",e=>{const r=e.target.closest("[data-rm]");if(r){TL.cart.remove(+r.dataset.rm);drawCart()}if(e.target.id==="clear"){TL.cart.clear();drawCart()}});
 document.body.addEventListener("change",e=>{const s=e.target.closest("[data-lic]");if(s){const c=TL.cart.get();c[+s.dataset.lic].license=s.value;TL.cart.set(c);drawCart()}});
});
</script></body></html>
